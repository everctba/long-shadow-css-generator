<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Long Shadow Text</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --accent: #1f6feb;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      height: 100%;
    }

    .panel {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
    }

    .panel h1 {
      font-size: 18px;
      margin: 0 0 14px;
    }

    .control {
      margin-bottom: 16px;
      transition: opacity 0.3s ease, max-height 0.3s ease;
    }

    .control.hidden {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      margin-bottom: 0;
      pointer-events: none;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .control input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .control select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .value {
      color: var(--fg);
      font-weight: 600;
    }

    .preview {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      min-height: 420px;
      transition: background 0.3s ease;
    }

    .text {
      font-size: 96px;
      line-height: 1;
      font-weight: 800;
      color: var(--fg);
      word-break: break-word;
      text-align: center;
      transition: color 0.3s ease, text-shadow 0.3s ease, font-size 0.2s ease;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .code-block {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      max-height: 220px;
    }

    .btn {
      appearance: none;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
      color: #111827;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #e5e7eb;
    }

    /* Tooltip styles */
    .tooltip-icon {
      cursor: help;
      color: var(--accent);
      font-weight: bold;
      margin-left: 4px;
      position: relative;
      display: inline-block;
    }

    .tooltip-icon:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      background: #1f2937;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: normal;
      max-width: 220px;
      width: max-content;
      z-index: 1000;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 8px;
      line-height: 1.4;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .tooltip-icon:hover::before {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-bottom-color: #1f2937;
      z-index: 1001;
    }

    /* Presets styles */
    .presets-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .presets-section h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: var(--fg);
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset-btn {
      padding: 12px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      background: white;
      position: relative;
      overflow: hidden;
    }

    .preset-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--preset-color, #ccc);
    }

    .preset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-color: var(--preset-color, #ccc);
    }

    .preset-btn:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="panel">
      <h1>Configurações</h1>
      <div class="control">
        <label for="texto"><span>Texto</span></label>
        <input id="texto" type="text" placeholder="Lorem Ipsum" />
      </div>
      <div class="control">
        <label for="tamanhoFonte">
          <span>Tamanho da Fonte (px) <span class="tooltip-icon"
              data-tooltip="Crie o efeito no tamanho do elemento que será utilizado, na mesma proporção. A sombra tem distância fixa e não escala com o tamanho do elemento.">ⓘ</span></span>
          <span class="value" id="tamanhoFonteVal"></span>
        </label>
        <input id="tamanhoFonte" type="range" min="12" max="200" step="1" value="96" />
      </div>
      <div class="control">
        <label for="skewY">
          <span>Inclinação (skewY)</span>
          <span class="value" id="skewYVal"></span>
        </label>
        <input id="skewY" type="range" min="-45" max="45" step="1" value="0" />
      </div>
      <div class="control">
        <label for="quantidade"><span>Quantidade de sombras</span><span class="value" id="quantidadeVal"></span></label>
        <input id="quantidade" type="range" min="1" max="300" step="1" />
      </div>
      <div class="row">
        <div class="control">
          <label for="distancia"><span>Distância por passo (px)</span><span class="value"
              id="distanciaVal"></span></label>
          <input id="distancia" type="range" min="0" max="10" step="0.01" />
        </div>
        <div class="control">
          <label for="angulo"><span>Ângulo (°)</span><span class="value" id="anguloVal"></span></label>
          <input id="angulo" type="range" min="0" max="360" step="1" />
        </div>
      </div>
      <div class="control">
        <label for="cor"><span>Cor da sombra</span><span class="value" id="corVal"></span></label>
        <input id="cor" type="color" value="#636363" />
      </div>
      <div class="control">
        <label for="alpha"><span>Alpha da sombra</span><span class="value" id="alphaVal"></span></label>
        <input id="alpha" type="range" min="0" max="1" step="0.01" />
      </div>
      <div class="row">
        <div class="control">
          <label for="modoTransparencia"><span>Modo de transparência</span><span class="value"
              id="modoVal"></span></label>
          <select id="modoTransparencia">
            <option value="linear">Linear</option>
            <option value="percentual">Percentual</option>
          </select>
        </div>
        <div class="control" id="decaimentoControl">
          <label for="decaimento"><span>Decaimento (%)</span><span class="value" id="decaimentoVal"></span></label>
          <input id="decaimento" type="range" min="0" max="50" step="1" />
        </div>
      </div>
      <div class="row">
        <div class="control">
          <label for="unidadeCss">
            <span>Unidade do CSS <span class="tooltip-icon"
                data-tooltip="Escolha entre Proporcional (em / Variáveis CSS) que se ajusta a qualquer tamanho de fonte ou Pixel fixo (px).">ⓘ</span></span>
            <span class="value" id="unidadeCssVal"></span>
          </label>
          <select id="unidadeCss">
            <option value="em">em / Variáveis CSS (Proporcional)</option>
            <option value="px">px (Fixo)</option>
          </select>
        </div>
        <div class="control" id="escalaControl">
          <label for="escala">
            <span>Escala (--shadow-scale) <span class="tooltip-icon"
                data-tooltip="Multiplicador dinâmico da extensão da sombra via variável CSS.">ⓘ</span></span>
            <span class="value" id="escalaVal">1.0x</span>
          </label>
          <input id="escala" type="range" min="0.1" max="5" step="0.1" value="1.0" />
        </div>
      </div>
      <div class="footer" id="footerText">0° para a direita, sentido horário.</div>

      <!-- Presets Section -->
      <div class="presets-section">
        <h2>Temas Pré-definidos</h2>
        <div class="presets-grid">
          <button class="preset-btn" data-preset="neon" style="--preset-color: #00ffff;">
            Neon Cyberpunk
          </button>
          <button class="preset-btn" data-preset="vintage" style="--preset-color: #ff8c42;">
            Vintage Retro
          </button>
          <button class="preset-btn" data-preset="minimal" style="--preset-color: #cccccc;">
            Minimalista
          </button>
          <button class="preset-btn" data-preset="ocean" style="--preset-color: #0077be;">
            Oceano
          </button>
          <button class="preset-btn" data-preset="sunset" style="--preset-color: #f7931e;">
            Sunset
          </button>
          <button class="preset-btn" data-preset="dark" style="--preset-color: #ffffff;">
            Dark Mode
          </button>
          <button class="preset-btn" data-preset="pastel" style="--preset-color: #c77dff;">
            Pastel
          </button>
          <button class="preset-btn" data-preset="fire" style="--preset-color: #ff6600;">
            Fire/Lava
          </button>
        </div>
      </div>
    </div>
    <div class="panel preview" id="previewPanel">
      <div id="textoPreview" class="text"></div>
    </div>
    <div class="panel">
      <div class="code-header">
        <h1>CSS gerado</h1>
        <button id="copiarCss" class="btn">Copiar CSS</button>
      </div>
      <div class="row">
        <div class="control">
          <label for="corTexto"><span>Cor do texto</span><span class="value" id="corTextoVal"></span></label>
          <input id="corTexto" type="color" value="#000000" />
        </div>
        <div class="control">
          <label for="corFundo"><span>Cor do fundo</span><span class="value" id="corFundoVal"></span></label>
          <input id="corFundo" type="color" value="#ffffff" />
        </div>
      </div>
      <pre id="cssOutput" class="code-block"></pre>
    </div>
  </div>
  <script>
    const elTexto = document.getElementById('texto');
    const elTamanhoFonte = document.getElementById('tamanhoFonte');
    const elTamanhoFonteVal = document.getElementById('tamanhoFonteVal');
    const elSkewY = document.getElementById('skewY');
    const elSkewYVal = document.getElementById('skewYVal');
    const elQuantidade = document.getElementById('quantidade');
    const elDistancia = document.getElementById('distancia');
    const elAngulo = document.getElementById('angulo');
    const elQuantidadeVal = document.getElementById('quantidadeVal');
    const elDistanciaVal = document.getElementById('distanciaVal');
    const elAnguloVal = document.getElementById('anguloVal');
    const elPreview = document.getElementById('textoPreview');
    const elCssOutput = document.getElementById('cssOutput');
    const elCopiarCss = document.getElementById('copiarCss');
    const elCor = document.getElementById('cor');
    const elCorVal = document.getElementById('corVal');
    const elAlpha = document.getElementById('alpha');
    const elAlphaVal = document.getElementById('alphaVal');
    const elModo = document.getElementById('modoTransparencia');
    const elModoVal = document.getElementById('modoVal');
    const elDecaimento = document.getElementById('decaimento');
    const elDecaimentoVal = document.getElementById('decaimentoVal');
    const elDecaimentoControl = document.getElementById('decaimentoControl');
    const elUnidadeCss = document.getElementById('unidadeCss');
    const elUnidadeCssVal = document.getElementById('unidadeCssVal');
    const elEscala = document.getElementById('escala');
    const elEscalaVal = document.getElementById('escalaVal');
    const elEscalaControl = document.getElementById('escalaControl');
    const elCorTexto = document.getElementById('corTexto');
    const elCorTextoVal = document.getElementById('corTextoVal');
    const elCorFundo = document.getElementById('corFundo');
    const elCorFundoVal = document.getElementById('corFundoVal');
    const elPreviewPanel = document.getElementById('previewPanel');
    const elFooterText = document.getElementById('footerText');

    function atualizarLabels() {
      elTamanhoFonteVal.textContent = elTamanhoFonte.value + 'px';
      elSkewYVal.textContent = elSkewY.value + '°';
      elQuantidadeVal.textContent = elQuantidade.value;
      elDistanciaVal.textContent = parseFloat(elDistancia.value).toFixed(2) + 'px';
      elAnguloVal.textContent = elAngulo.value + '°';
      elCorVal.textContent = elCor.value;
      elAlphaVal.textContent = parseFloat(elAlpha.value).toFixed(2);
      elCorTextoVal.textContent = elCorTexto.value;
      elCorFundoVal.textContent = elCorFundo.value;
      elModoVal.textContent = elModo.value === 'percentual' ? 'Percentual' : 'Linear';
      elDecaimentoVal.textContent = parseInt(elDecaimento.value, 10) + '%';
      elUnidadeCssVal.textContent = elUnidadeCss.value === 'em' ? 'Proporcional (em)' : 'Fixo (px)';
      elEscalaVal.textContent = parseFloat(elEscala.value).toFixed(1) + 'x';

      if (elUnidadeCss.value === 'em') {
        elEscalaControl.classList.remove('hidden');
      } else {
        elEscalaControl.classList.add('hidden');
      }
    }

    function atualizarVisibilidadeModo() {
      const modo = elModo.value;

      if (modo === 'percentual') {
        elDecaimentoControl.classList.remove('hidden');
        elFooterText.textContent = '0° para a direita, sentido horário. Transparência decresce percentualmente.';
      } else {
        elDecaimentoControl.classList.add('hidden');
        elFooterText.textContent = '0° para a direita, sentido horário. Transparência decresce linearmente.';
      }
    }

    const presets = {
      neon: {
        corFundo: '#0a0e27',
        corTexto: '#00ffff',
        corSombra: '#ff00ff',
        alpha: 0.06,
        quantidade: 80,
        distancia: 1,
        angulo: 135,
        modo: 'percentual',
        decaimento: 3
      },
      vintage: {
        corFundo: '#f5e6d3',
        corTexto: '#8b4513',
        corSombra: '#ff8c42',
        alpha: 0.05,
        quantidade: 60,
        distancia: 1.2,
        angulo: 45,
        modo: 'percentual',
        decaimento: 5
      },
      minimal: {
        corFundo: '#ffffff',
        corTexto: '#000000',
        corSombra: '#cccccc',
        alpha: 0.08,
        quantidade: 50,
        distancia: 1,
        angulo: 45,
        modo: 'linear',
        decaimento: 0
      },
      ocean: {
        corFundo: '#e0f7ff',
        corTexto: '#003d5c',
        corSombra: '#0077be',
        alpha: 0.04,
        quantidade: 70,
        distancia: 1,
        angulo: 90,
        modo: 'percentual',
        decaimento: 4
      },
      sunset: {
        corFundo: '#ff6b35',
        corTexto: '#f7931e',
        corSombra: '#c1121f',
        alpha: 0.07,
        quantidade: 65,
        distancia: 1.5,
        angulo: 225,
        modo: 'percentual',
        decaimento: 6
      },
      dark: {
        corFundo: '#121212',
        corTexto: '#ffffff',
        corSombra: '#333333',
        alpha: 0.15,
        quantidade: 55,
        distancia: 1,
        angulo: 135,
        modo: 'linear',
        decaimento: 0
      },
      pastel: {
        corFundo: '#ffd6e8',
        corTexto: '#9d4edd',
        corSombra: '#c77dff',
        alpha: 0.06,
        quantidade: 75,
        distancia: 0.8,
        angulo: 315,
        modo: 'percentual',
        decaimento: 5
      },
      fire: {
        corFundo: '#1a1a1a',
        corTexto: '#ff6600',
        corSombra: '#cc0000',
        alpha: 0.08,
        quantidade: 90,
        distancia: 1,
        angulo: 180,
        modo: 'percentual',
        decaimento: 4
      }
    };

    function aplicarPreset(presetName) {
      const preset = presets[presetName];
      if (!preset) return;

      elCorFundo.value = preset.corFundo;
      elCorTexto.value = preset.corTexto;
      elCor.value = preset.corSombra;
      elAlpha.value = preset.alpha;
      elQuantidade.value = preset.quantidade;
      elDistancia.value = preset.distancia;
      elAngulo.value = preset.angulo;
      elModo.value = preset.modo;
      elDecaimento.value = preset.decaimento;

      atualizarLabels();
      atualizarVisibilidadeModo();
      gerarSombra();
    }
    function hexToRgb(h) {
      const s = h.replace('#', '');
      const r = parseInt(s.slice(0, 2), 16);
      const g = parseInt(s.slice(2, 4), 16);
      const b = parseInt(s.slice(4, 6), 16);
      return [r, g, b];
    }

    function gerarSombra() {
      const texto = elTexto.value || '';
      const N = parseInt(elQuantidade.value, 10);
      const step = parseFloat(elDistancia.value);
      const ang = parseInt(elAngulo.value, 10);
      const theta = ang * Math.PI / 180;
      const cos = Math.cos(theta);
      const sin = Math.sin(theta);
      const [r, g, b] = hexToRgb(elCor.value);
      const baseAlpha = parseFloat(elAlpha.value);
      const textColor = elCorTexto.value;
      const bgColor = elCorFundo.value;
      const p = Math.max(0, Math.min(1, parseInt(elDecaimento.value, 10) / 100));
      const fator = 1 - p;
      const unidade = elUnidadeCss.value;
      const fontSize = parseFloat(elTamanhoFonte.value) || 96;
      const escala = parseFloat(elEscala.value) || 1.0;

      const previewShadows = [];
      const cssShadows = [];

      for (let i = 1; i <= N; i++) {
        const dxPx = cos * step * i;
        const dyPx = sin * step * i;
        const alpha = elModo.value === 'percentual'
          ? baseAlpha * Math.pow(fator, i - 1)
          : baseAlpha * ((N - i + 1) / N);

        const dxPreview = unidade === 'em' ? dxPx * escala : dxPx;
        const dyPreview = unidade === 'em' ? dyPx * escala : dyPx;
        previewShadows.push(`${dxPreview.toFixed(2)}px ${dyPreview.toFixed(2)}px rgba(${r},${g},${b},${alpha.toFixed(4)})`);

        if (unidade === 'em') {
          const dxEm = dxPx / fontSize;
          const dyEm = dyPx / fontSize;
          cssShadows.push(`calc(var(--shadow-scale, 1) * ${dxEm.toFixed(4)}em) calc(var(--shadow-scale, 1) * ${dyEm.toFixed(4)}em) rgba(${r},${g},${b},${alpha.toFixed(4)})`);
        } else {
          cssShadows.push(`${dxPx.toFixed(2)}px ${dyPx.toFixed(2)}px rgba(${r},${g},${b},${alpha.toFixed(4)})`);
        }
      }

      elPreview.textContent = texto || 'Lorem Ipsum';
      elPreview.style.fontSize = elTamanhoFonte.value + 'px';
      elPreview.style.transform = `skewY(${elSkewY.value}deg)`;
      elPreview.style.textShadow = previewShadows.join(', ');
      elPreview.style.color = textColor;
      elPreviewPanel.style.background = bgColor;

      let css = '';
      if (unidade === 'em') {
        css = `/* Sombra proporcional ao tamanho da fonte e escalável via variável CSS */\n.long-shadow {\n  --shadow-scale: ${escala.toFixed(1)}; /* Altere para multiplicar o alcance da sombra */\n  color: ${textColor};\n  background: ${bgColor};\n  text-shadow: ${cssShadows.join(', ')};\n}`;
      } else {
        css = `.long-shadow {\n  color: ${textColor};\n  background: ${bgColor};\n  text-shadow: ${cssShadows.join(', ')};\n}`;
      }
      elCssOutput.textContent = css;
    }

    function init() {
      elTexto.value = '';
      elTamanhoFonte.value = '96';
      elSkewY.value = '0';
      elQuantidade.value = '62';
      elDistancia.value = '1';
      elAngulo.value = '45';
      elCor.value = '#636363';
      elAlpha.value = '0.04';
      elModo.value = 'percentual';
      elDecaimento.value = '5';
      elUnidadeCss.value = 'em';
      elEscala.value = '1.0';
      elCorTexto.value = '#000000';
      elCorFundo.value = '#ffffff';
      atualizarLabels();
      atualizarVisibilidadeModo();
      gerarSombra();
    }

    elTexto.addEventListener('input', gerarSombra);
    elTamanhoFonte.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elSkewY.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elQuantidade.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elDistancia.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elAngulo.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elCor.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elAlpha.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elModo.addEventListener('change', () => { atualizarLabels(); atualizarVisibilidadeModo(); gerarSombra(); });
    elDecaimento.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elUnidadeCss.addEventListener('change', () => { atualizarLabels(); atualizarVisibilidadeModo(); gerarSombra(); });
    elEscala.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elCorTexto.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });
    elCorFundo.addEventListener('input', () => { atualizarLabels(); gerarSombra(); });

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = btn.getAttribute('data-preset');
        aplicarPreset(preset);
      });
    });

    init();

    elCopiarCss.addEventListener('click', () => {
      const code = elCssOutput.textContent || '';
      const prev = elCopiarCss.textContent;
      navigator.clipboard.writeText(code).then(() => {
        elCopiarCss.textContent = 'Copiado!';
        setTimeout(() => { elCopiarCss.textContent = prev; }, 1200);
      });
    });
  </script>
